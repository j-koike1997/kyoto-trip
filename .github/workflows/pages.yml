name: Deploy Kyoto Trip to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add character guide, restaurant links, Kitanamaro features, traffic plan, rain plan, sword notes and catGPT tone
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Main page runtime additions
          p=Path('index.html')
          s=p.read_text()
          marker='  const finalFix=`<style id="published-final-fix">'
          inject="""  const peopleSection=await (await fetch('site/people.html',{cache:'no-store'})).text();
          html=html.replace('<section class=\"section\" id=\"connections\">',peopleSection+'<section class=\"section\" id=\"connections\">');
          html=html.replace('<a href=\"#chronology\">年表</a>','<a href=\"#people\">人物</a><a href=\"#chronology\">年表</a>');
          html=html.replace('<a class=\"btn\" href=\"#history-2\">由来を見る</a>','<a class=\"btn\" href=\"#history-2\">由来を見る</a><a class=\"btn gold\" href=\"https://tabelog.com/kyoto/A2601/A260601/26001213/\" target=\"_blank\" rel=\"noopener\">食べログ</a>');
          html=html.replace('<a class=\"btn\" href=\"#history-14\">由来を見る</a>','<a class=\"btn\" href=\"#history-14\">由来を見る</a><a class=\"btn gold\" href=\"https://tabelog.com/shiga/A2501/A250101/25000784/\" target=\"_blank\" rel=\"noopener\">食べログ</a>');
          html=html.replace('</head>','<style id=\"kitanamaro-hero-style\">.hero{position:relative;overflow:hidden}.hero:after{content:\"\";position:absolute;width:230px;height:230px;border-radius:50%;right:-92px;top:55px;z-index:0;opacity:.98;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.32),rgba(255,255,255,.18) 44%,rgba(83,151,177,.24) 100%),url(\"site/kitanamaro.svg\") center/80% no-repeat}.hero-inner{position:relative;z-index:1}@media(max-width:720px){.hero:after{width:176px;height:176px;right:-62px;top:86px;background-size:78%}}@media(max-width:480px){.hero:after{width:150px;height:150px;right:-56px;top:116px;background-size:76%;opacity:.95}}</style></head>');
          html=html.replace('</body>','<script src=\"site/traffic-plan.js\"><\\/script><script src=\"site/rain-fix.js\"><\\/script><script src=\"site/sword-notes.js\"><\\/script><script src=\"site/neko-tone.js\"><\\/script></body>');
          """
          if 'site/people.html' not in s or 'kitanamaro-hero-style' not in s or 'site/traffic-plan.js' not in s or 'site/rain-fix.js' not in s or 'site/sword-notes.js' not in s or 'site/neko-tone.js' not in s:
              if marker not in s:
                  raise SystemExit('injection marker not found')
              s=s.replace(marker,inject+marker)
              p.write_text(s)

          # Add the banknote story to Wake no Kiyomaro's character card.
          pp=Path('site/people.html')
          ps=pp.read_text()
          if 'kitanamaro-banknote' not in ps:
              css='''.kitanamaro-banknote{margin-top:14px;padding:13px;border:1px solid #d9c58c;border-radius:13px;background:#fbf7ed}.kitanamaro-banknote figure{margin:0}.kitanamaro-banknote img{display:block;width:100%;height:auto;border-radius:9px;background:#eee}.kitanamaro-banknote figcaption{margin-top:9px;font-size:.84rem;line-height:1.65;color:#4e5660}.kitanamaro-banknote figcaption strong{display:block;color:var(--navy);font-size:.94rem;margin-bottom:4px}.kitanamaro-banknote a{display:inline-block;margin-top:6px;color:#5f6670;text-decoration:underline;text-underline-offset:2px;font-size:.76rem}'''
              ps=ps.replace('</style>',css+'</style>',1)
              needle='<div class="person-keywords"><span>平安京</span><span>宇佐八幡宮神託事件</span><span>桓武天皇</span></div></article>'
              feature='''<div class="kitanamaro-banknote"><figure><img src="https://www.npb.go.jp/museum/collection/gallery/osatu/ura-inosisi.images/img_gllry_72urainosisi.jpg" alt="日本銀行兌換券 甲10円 いのしし札（表面・裏面）" loading="lazy" decoding="async"><figcaption><strong>「きたなまろ」から、お札の顔へ</strong>和気清麻呂は明治23（1890）年の改造十円券以降、複数の10円券の肖像に採用された。なかでも明治32（1899）年発行の日本銀行兌換券・甲10円券は、表面に和気清麻呂と護王神社、裏面中央に大きな猪が描かれ、「いのしし札」の愛称で親しまれた。国立印刷局によると、清麻呂の精細な肖像画が残っていなかったため、肖像原図はキヨッソーネが木戸孝允をモデルに描いたといわれる。配流時に「別部穢麻呂（わけべのきたなまろ）」と改名させられた人物が、約1100年後に近代国家の紙幣へ繰り返し登場したことは、明治期に清麻呂がどのように顕彰されたかを象徴している。<br><a href="https://www.npb.go.jp/museum/collection/gallery/osatu/ura-inosisi.html" target="_blank" rel="noopener">国立印刷局「いのしし札」解説・画像出典 ↗</a></figcaption></figure></div><div class="person-keywords"><span>平安京</span><span>宇佐八幡宮神託事件</span><span>桓武天皇</span><span>10円札</span><span>いのしし札</span></div></article>'''
              if needle not in ps:
                  raise SystemExit('Wake no Kiyomaro card marker not found')
              ps=ps.replace(needle,feature,1)
              pp.write_text(ps)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
